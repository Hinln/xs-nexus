    timeout-minutes: 35
    env:
      XS_TEST_DATABASE_URL: postgresql://xs_test@127.0.0.1:5432/xs_nexus_test
    services:
      postgres:
        image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_USER: xs_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xs_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xs_test -d xs_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
      - name: Run update supply-chain failure matrix
        run: |
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "XS_TEST_DATABASE_URL=$XS_TEST_DATABASE_URL" \
            EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts/update-supply-chain" \
            make test-update-supply-chain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: update-supply-chain-evidence
          path: artifacts/update-supply-chain
          if-no-files-found: error

  onepanel-coexistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p artifacts/onepanel-coexistence
      - run: shellcheck scripts/test-onepanel-network-runtime.sh
      - name: Validate current Compose and lifecycle boundary
        run: |
          set -o pipefail
          python3 scripts/test-onepanel-boundary.py 2>&1 | tee artifacts/onepanel-coexistence/source-tests.log
          python3 scripts/validate-onepanel-boundary.py --require-compose 2>&1 | tee artifacts/onepanel-coexistence/source-validation.log
      - name: Exercise external network across Docker restart
        env:
          XS_ONEPANEL_CI_FIXTURE: "1"
        run: |
          set -o pipefail
          ./scripts/test-onepanel-network-runtime.sh 2>&1 | tee artifacts/onepanel-coexistence/runtime.log
          printf 'revision=%s\nstatus=PASS\n' "$GITHUB_SHA" >artifacts/onepanel-coexistence/summary.txt
          sha256sum artifacts/onepanel-coexistence/runtime.log \
            artifacts/onepanel-coexistence/source-tests.log \
            artifacts/onepanel-coexistence/source-validation.log \
            artifacts/onepanel-coexistence/summary.txt \
            >artifacts/onepanel-coexistence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: onepanel-coexistence-evidence
          path: artifacts/onepanel-coexistence
          if-no-files-found: error

  linux-agent-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      XS_TEST_DATABASE_URL: postgresql://xs_test@127.0.0.1:5432/xs_nexus_test
    services:
      postgres:
        image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_USER: xs_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xs_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xs_test -d xs_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - run: mkdir -p artifacts/linux-agent-recovery
      - run: shellcheck scripts/test-agent-systemd.sh
      - name: Run real systemd Agent recovery
        run: |
          mkdir -p artifacts/linux-agent-recovery
          set -o pipefail
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "XS_TEST_DATABASE_URL=$XS_TEST_DATABASE_URL" \
            make test-agent-systemd 2>&1 | tee artifacts/linux-agent-recovery/test.log
          printf 'revision=%s\nstatus=PASS\n' "$GITHUB_SHA" >artifacts/linux-agent-recovery/summary.txt
          sha256sum artifacts/linux-agent-recovery/test.log \
            artifacts/linux-agent-recovery/summary.txt \
            >artifacts/linux-agent-recovery/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-agent-recovery-evidence
          path: artifacts/linux-agent-recovery
          if-no-files-found: error

  relay-resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      XS_TEST_DATABASE_URL: postgresql://xs_test@127.0.0.1:5432/xs_nexus_test
    services:
      postgres:
        image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_USER: xs_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xs_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xs_test -d xs_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - run: mkdir -p artifacts/relay-resilience
      - run: shellcheck scripts/test-agent-relay.sh scripts/test-relay-throughput.sh
      - name: Run Relay unit and resource-boundary tests
        run: |
          set -o pipefail
          cargo test -p xs-relay --all-targets 2>&1 | tee artifacts/relay-resilience/unit-tests.log
      - name: Run sustained Relay capacity baseline
        run: |
          EVIDENCE_DIR=artifacts/relay-resilience/capacity \
            XS_RELAY_THROUGHPUT_PACKETS=5000000 \
            XS_RELAY_MINIMUM_PACKETS_PER_SECOND=10000 \
            make test-relay-throughput
      - name: Run Relay loss and restart recovery
        run: |
          set -o pipefail
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "XS_TEST_DATABASE_URL=$XS_TEST_DATABASE_URL" \
            make test-agent-relay 2>&1 | tee artifacts/relay-resilience/test.log
          printf 'revision=%s\nstatus=PASS\n' "$GITHUB_SHA" >artifacts/relay-resilience/summary.txt
          sha256sum artifacts/relay-resilience/test.log \
            artifacts/relay-resilience/unit-tests.log \
            artifacts/relay-resilience/capacity/SHA256SUMS \
            artifacts/relay-resilience/capacity/environment.txt \
            artifacts/relay-resilience/capacity/report.json \
            artifacts/relay-resilience/capacity/revision.txt \
            artifacts/relay-resilience/capacity/test-output.txt \
            artifacts/relay-resilience/summary.txt \
            >artifacts/relay-resilience/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: relay-resilience-evidence
          path: artifacts/relay-resilience
          if-no-files-found: error

  acl-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XS_TEST_DATABASE_URL: postgresql://xs_test@127.0.0.1:5432/xs_nexus_test
    services:
      postgres:
        image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_USER: xs_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xs_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xs_test -d xs_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - run: mkdir -p artifacts/acl-enforcement
      - run: shellcheck scripts/test-agent-acl.sh scripts/test-agent-relay.sh scripts/test-agent-subnet-route.sh
      - name: Run ACL identity and rollback unit regressions
        run: |
          set -o pipefail
          cargo test -p xs-protocol --test session authenticated_header_and_virtual_source_are_enforced 2>&1 | tee artifacts/acl-enforcement/protocol.log
          cargo test -p xs-agent --lib configuration_update_rejects 2>&1 | tee artifacts/acl-enforcement/configuration.log
      - name: Run three-node disconnected-controller ACL matrix
        run: |
          set -o pipefail
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            make test-agent-acl 2>&1 | tee artifacts/acl-enforcement/direct.log
      - name: Run Relay ACL bypass regression
        run: |
          set -o pipefail
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "XS_TEST_DATABASE_URL=$XS_TEST_DATABASE_URL" \
            make test-agent-relay 2>&1 | tee artifacts/acl-enforcement/relay.log
      - name: Run subnet-router ACL bypass regression
        run: |
          set -o pipefail
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            make test-agent-subnet-route 2>&1 | tee artifacts/acl-enforcement/subnet.log
          printf 'revision=%s\nstatus=PASS\n' "$GITHUB_SHA" >artifacts/acl-enforcement/summary.txt
          sha256sum artifacts/acl-enforcement/configuration.log \
            artifacts/acl-enforcement/direct.log \
            artifacts/acl-enforcement/protocol.log \
            artifacts/acl-enforcement/relay.log \
            artifacts/acl-enforcement/subnet.log \
            artifacts/acl-enforcement/summary.txt \
            >artifacts/acl-enforcement/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acl-enforcement-evidence
          path: artifacts/acl-enforcement
