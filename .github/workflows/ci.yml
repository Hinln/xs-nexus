name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      XS_TEST_DATABASE_URL: postgresql://xs_test@127.0.0.1:5432/xs_nexus_test
      XS_TEST_DATABASE_SCHEMA: xs_nexus_test
    services:
      postgres:
        image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_USER: xs_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xs_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xs_test -d xs_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt,rust-src
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: npm ci
      - run: make fmt-check
      - run: make lint
      - run: make build
      - run: make test
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: make test-windows-xsnet-transport
      - run: make test-independent-implementation
      - run: make test-source-sbom
      - run: make security-check
      - run: make dependency-check

  protocol-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-01
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: FUZZ_SECONDS=30 make test-protocol-fuzz EVIDENCE_DIR=artifacts/fuzz-ci
