  console-real-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XS_TEST_DATABASE_URL: postgresql://xs_test@127.0.0.1:5432/xs_nexus_test
    services:
      postgres:
        image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
        env:
          POSTGRES_USER: xs_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: xs_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xs_test -d xs_nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: shellcheck scripts/test-console-real-e2e.sh
      - run: make test-console-real-e2e EVIDENCE_DIR=artifacts/console-real-e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: console-real-e2e-evidence
          path: artifacts/console-real-e2e
          if-no-files-found: error

  protocol-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
