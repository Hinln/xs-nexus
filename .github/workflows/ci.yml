  current-revision-soak-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
      - name: Validate Gate 22 harness syntax
        run: |
          shellcheck scripts/test-current-revision-soak.sh
          python3 -m py_compile scripts/summarize-current-revision-soak.py
          python3 scripts/test-summarize-current-revision-soak.py
          docker compose --env-file deploy/docker/gate22.compose.env.example \
            -f deploy/docker/compose.yaml -f deploy/docker/compose.soak.yaml config --quiet
      - name: Run current-revision soak calibration
        run: |
          mkdir -p artifacts/current-revision-soak-calibration
          sudo env \
            "PATH=$PATH" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            XS_SOAK_CALIBRATION=1 \
            XS_SOAK_DURATION_SECONDS=600 \
            XS_SOAK_SAMPLE_INTERVAL_SECONDS=10 \
            EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts/current-revision-soak-calibration" \
            make test-current-revision-soak
      - name: Restore evidence ownership
        if: always()
        run: sudo chown -R "$USER:$USER" artifacts/current-revision-soak-calibration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: current-revision-soak-calibration-evidence
          path: artifacts/current-revision-soak-calibration
          if-no-files-found: error
