[workspace]
members = [
  "apps/agent",
  "apps/cli",
  "apps/controller",
  "apps/relay",
  "crates/core",
  "crates/protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "=0.23.0"
chacha20poly1305 = "=0.10.1"
chrono = { version = "=0.4.45", features = ["serde"] }
ed25519-dalek = "=3.0.0"
futures-util = "=0.3.33"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
http-body-util = "=0.1.4"
ipnet = { version = "=2.12.0", features = ["serde"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
rtnetlink = "=0.21.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "=2.6.1"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-tun = "=0.15.2"
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["limit", "request-id", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
x25519-dalek = "=2.0.1"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
