[workspace]
members = [
  "apps/agent",
  "apps/cli",
  "apps/controller",
  "apps/relay",
  "crates/core",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
