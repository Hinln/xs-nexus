services:
  edge:
    image: ${XS_EDGE_IMAGE:?set XS_EDGE_IMAGE}
    user: "65532:65532"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - type: bind
        source: ${XS_EDGE_CONFIG_FILE:?set XS_EDGE_CONFIG_FILE}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XS_EDGE_DATA_DIR:?set XS_EDGE_DATA_DIR}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=16m,mode=0700,uid=65532,gid=65532
    ports:
      - target: 8080
        published: ${XS_EDGE_HTTP_PORT:-80}
        host_ip: ${XS_EDGE_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
      - target: 8443
        published: ${XS_EDGE_HTTPS_PORT:-443}
        host_ip: ${XS_EDGE_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
    name: 1panel-network
