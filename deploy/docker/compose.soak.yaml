services:
  postgres:
    image: postgres:18-alpine3.22@sha256:774521500f4c22761b25a6bdb772a0a3c2e8dd32468210bdad9231c5752ea398
    restart: unless-stopped
    environment:
      POSTGRES_USER: gate22_bootstrap
      POSTGRES_DB: gate22
      POSTGRES_PASSWORD_FILE: /run/secrets/xs-gate22/bootstrap-password
    volumes:
      - type: bind
        source: ${XS_GATE22_POSTGRES_SECRETS_DIR:?set XS_GATE22_POSTGRES_SECRETS_DIR}
        target: /run/secrets/xs-gate22
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XS_GATE22_REPOSITORY_ROOT:?set XS_GATE22_REPOSITORY_ROOT}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - gate22-postgres-data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U gate22_bootstrap -d gate22"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      com.xs-nexus.gate22.database: "true"
    networks:
      1panel-network:
        ipv4_address: ${XS_GATE22_POSTGRES_IP:?set XS_GATE22_POSTGRES_IP}

  controller:
    networks:
      1panel-network:
        aliases:
          - xs-nexus-${XS_DEPLOYMENT:-dev}-controller
        ipv4_address: ${XS_GATE22_CONTROLLER_IP:?set XS_GATE22_CONTROLLER_IP}

  relay:
    networks:
      1panel-network:
        aliases:
          - xs-nexus-${XS_DEPLOYMENT:-dev}-relay
        ipv4_address: ${XS_GATE22_RELAY_IP:?set XS_GATE22_RELAY_IP}

  console:
    networks:
      1panel-network:
        aliases:
          - xs-nexus-${XS_DEPLOYMENT:-dev}-console
        ipv4_address: ${XS_GATE22_CONSOLE_IP:?set XS_GATE22_CONSOLE_IP}

networks:
  1panel-network:
    external: true
    name: ${XS_GATE22_NETWORK:?set XS_GATE22_NETWORK}

volumes:
  gate22-postgres-data:
